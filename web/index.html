<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaChat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 登录/注册界面 ===== -->
<div id="auth-screen" class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">✧</div>
      <h1>NovaChat</h1>
      <p>Fast. Secure. Real-time.</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Log In</button>
      <button class="auth-tab" data-tab="register">Sign Up</button>
    </div>
    <form id="login-form" class="auth-form active">
      <input type="text" id="login-username" placeholder="Username" autocomplete="username">
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
      <button type="submit" class="auth-submit">Log In</button>
      <p id="login-error" class="auth-error"></p>
    </form>
    <form id="register-form" class="auth-form">
      <input type="text" id="reg-username" placeholder="Username (3-32 chars, letters only)" autocomplete="username">
      <input type="text" id="reg-firstname" placeholder="First Name">
      <input type="text" id="reg-lastname" placeholder="Last Name (optional)">
      <input type="password" id="reg-password" placeholder="Password (min 8 chars)" autocomplete="new-password">
      <button type="submit" class="auth-submit">Create Account</button>
      <p id="register-error" class="auth-error"></p>
    </form>
  </div>
</div>

<!-- ===== 主聊天界面 (登录后可见) ===== -->
<div id="chat-screen" class="chat-container" style="display:none">

  <!-- 左侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <button id="menu-btn" class="icon-btn" title="Menu">☰</button>
      <span class="sidebar-title">NovaChat</span>
      <button id="new-chat-btn" class="icon-btn" title="New Chat">+</button>
    </div>
    <div class="sidebar-search" style="display:flex;gap:8px;">
      <input type="text" id="search-input" placeholder="Search users..." style="flex:1;">
      <button id="create-room-btn" class="icon-btn" title="Create Voice Room" style="font-size:18px;">🔊</button>
    </div>
    <div id="chat-list" class="chat-list"></div>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="my-avatar"></div>
        <div class="user-detail">
          <span id="my-username"></span>
          <span class="user-status">online</span>
        </div>
      </div>
      <button id="logout-btn" class="icon-btn" title="Logout">⏻</button>
    </div>
  </div>

  <!-- 右侧聊天窗口 -->
  <div class="chat-main" id="chat-main">
    <div class="chat-placeholder">
      <div class="placeholder-logo">✧</div>
      <h2>Welcome to NovaChat</h2>
      <p>Select a chat or start a new conversation</p>
    </div>
  </div>
</div>

<!-- ===== 聊天窗口模板 (JS 动态创建) ===== -->
<template id="chat-window-template">
  <div class="chat-window">
    <div class="chat-header">
      <button class="back-btn icon-btn">←</button>
      <div class="chat-peer-info">
        <div class="peer-avatar"></div>
        <div class="peer-detail">
          <span class="peer-name"></span>
          <span class="peer-status">last seen recently</span>
        </div>
      </div>
      <button class="call-btn icon-btn" title="Call">📞</button>
    </div>
    <div class="chat-messages"></div>
    <div class="chat-input-bar">
      <input type="text" class="chat-input" placeholder="Write a message..." autofocus>
      <button class="send-btn">Send</button>
    </div>
  </div>
</template>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
